# Research tool for the bit register: GitHub's runners can reach Wikimedia
# Commons, so the search and the downloads run here and land on a branch.
name: Bit register images

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "search (collect candidates) or fetch (download picks)"
        required: true
        default: search
        type: choice
        options: [search, search2, search3, search4, openverse, fetch, refs, research, research2, plates]

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Search Wikimedia Commons
        if: ${{ inputs.stage == 'search' }}
        run: node tools/bit-images/search.js
      - name: Second search round and category crawl
        if: ${{ inputs.stage == 'search2' }}
        run: QUERIES=queries2.json OUT=candidates2.json OUT_DIR=candidates2 node tools/bit-images/search.js
      - name: Third round, anatomy references at 640 px
        if: ${{ inputs.stage == 'search3' }}
        run: QUERIES=queries3.json OUT=candidates3.json OUT_DIR=candidates3 REVIEW_WIDTH=640 node tools/bit-images/search.js
      - name: Fourth round, narrow anatomy references
        if: ${{ inputs.stage == 'search4' }}
        run: QUERIES=queries4.json OUT=candidates4.json OUT_DIR=candidates4 REVIEW_WIDTH=800 CATEGORY_LIMIT=200 node tools/bit-images/search.js
      - name: Anatomy reference plates
        if: ${{ inputs.stage == 'refs' }}
        run: node tools/bit-images/fetch-refs.js
      - name: Openverse search
        if: ${{ inputs.stage == 'openverse' }}
        run: node tools/bit-images/search-openverse.js
      - name: Anatomical plates and carriage photographs from open-access collections
        if: ${{ inputs.stage == 'research' }}
        run: node tools/bit-images/research.js
      - name: Targeted research, named atlases only
        if: ${{ inputs.stage == 'research2' }}
        env:
          BOOK_FILTER: "stubbs|leisering|gurlt|landseer|ellenberger|ruini"
          BOOK_PAGES: "120"
          WELLCOME_LIMIT: "40"
          BOOK_LIMIT: "3"
        run: node tools/bit-images/research.js
      - name: Chosen anatomical plates at full size
        if: ${{ inputs.stage == 'plates' }}
        run: node tools/bit-images/fetch-plates.js
      - name: Download the chosen photographs
        if: ${{ inputs.stage == 'fetch' }}
        run: node tools/bit-images/fetch.js
      - name: Push results to a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "bit-images-${{ inputs.stage }}"
          git add -A tools/bit-images assets/img/bits assets/data/bits/images.json 2>/dev/null || git add -A tools/bit-images
          git commit -m "Bit register images: ${{ inputs.stage }} results" || echo "nothing to commit"
          git push -f origin "bit-images-${{ inputs.stage }}"
