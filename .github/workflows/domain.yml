# Custom domain hrossagrith.com for the GitHub Pages site: DNS check, Cloudflare
# records and HTTPS enforcement. Logic in tools/domain/domain.js, records in
# tools/domain/records.json.
name: Custom domain

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (read only), apply (write Cloudflare records), https (enforce HTTPS on Pages)"
        required: true
        default: check
        type: choice
        options: [check, apply, https]

permissions:
  contents: read
  pages: write

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          MODE: ${{ inputs.mode }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/domain/domain.js
      - name: Response headers
        if: ${{ inputs.mode != 'apply' }}
        run: |
          for url in http://hrossagrith.com https://hrossagrith.com http://www.hrossagrith.com https://www.hrossagrith.com https://hrossagrith.github.io; do
            echo "== curl -sI $url"
            curl -sI -m 20 "$url" | grep -i -E "^(HTTP|location|server|content-type)" || echo "curl exit $?"
          done
          echo "== page-level HTTPS redirect in the served HTML"
          curl -s -m 20 http://hrossagrith.com/ | grep -c "Serve the site over HTTPS only" || echo "not found"
