name: Publish payload

# The site is generated outside this repository and delivered as one tarball,
# because uploading a directory tree through the GitHub web UI costs one
# commit per directory. Dropping payload/site.tar.gz on main unpacks it.

on:
  push:
    paths:
      - 'payload/site.tar.gz'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the payload over the working tree
        run: |
          set -euo pipefail
          test -f payload/site.tar.gz
          tar -xzf payload/site.tar.gz -C .
          rm -rf payload

      - name: Commit the result
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to publish" && exit 0
          git commit -m "Publish site from payload"
          git push
