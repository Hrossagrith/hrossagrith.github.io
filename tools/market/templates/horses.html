<section class="mk-wrap mk-results-head">
  <div class="mk-tabs" role="tablist" aria-label="{{t.listing_type}}">
    <a class="mk-tabs__tab" role="tab" data-type-tab="0">{{t.type_sale}}</a>
    <a class="mk-tabs__tab" role="tab" data-type-tab="1">{{t.type_loan}}</a>
  </div>
  <h1 class="mk-h1 mk-h1--results"><span data-headline></span></h1>
  <p class="mk-refprice"><span data-count></span><span data-refprice></span></p>
  <div class="mk-results-tools">
    <form class="mk-inline-search" role="search" data-results-form>
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.6 12.6 17 17"/></svg>
      <input type="search" name="q" placeholder="{{t.search_placeholder}}" aria-label="{{t.search_label}}" autocomplete="off" maxlength="120" data-results-q>
    </form>
    <button type="button" class="mk-pill" data-filters-open aria-controls="mk-filters">{{t.filters}} <span data-filter-count></span></button>
    <button type="button" class="mk-pill" data-save-search>{{t.save_search}}</button>
  </div>
  <div class="mk-refine" data-refine hidden>
    <span class="mk-refine__label" data-refine-label></span>
    <ul class="mk-refine__list" data-refine-list></ul>
  </div>
</section>

<div class="mk-sheet" id="mk-filters" data-filters role="dialog" aria-modal="true" aria-label="{{t.filters}}" hidden>
  <div class="mk-sheet__panel">
    <div class="mk-filters__head">
      <h2>{{t.filters}}</h2>
      <button type="button" class="mk-textbtn" data-filters-reset>{{t.filters_reset}}</button>
      <button type="button" class="mk-btn mk-btn--sm" data-filters-close>{{t.filters_show}}</button>
    </div>
    <ul class="mk-chips" data-chips></ul>
    <div class="mk-filters__body" data-filter-groups></div>
  </div>
</div>

<section class="mk-wrap mk-sets" aria-label="{{t.results}}" data-sets></section>
<div class="mk-wrap mk-more">
  <p class="mk-small" data-sets-progress></p>
  <button type="button" class="mk-btn mk-btn--ghost" data-more hidden>{{t.next_three}}</button>
  <span class="mk-sentinel" data-sentinel></span>
</div>

<div class="mk-wrap mk-empty" data-empty hidden>
  <h2>{{t.empty_title}}</h2>
  <p>{{t.empty_text}}</p>
  <ul class="mk-refine__list" data-empty-relax></ul>
</div>
