<section class="mk-section mk-section--top">
  <div class="mk-wrap">
    <div class="mk-dept" role="tablist" data-dept>
      <a class="mk-dept__tab" role="tab" data-d="horses" href="?d=horses">{{t.dept_horses}}</a>
      <a class="mk-dept__tab" role="tab" data-d="tack" href="?d=tack">{{t.dept_tack}}</a>
    </div>
    <h1 class="mk-h1" data-cat-title></h1>
    <p class="mk-lede" data-cat-lede></p>
    <div class="mk-chips mk-chips--filter" data-filters></div>
    <div class="mk-grid mk-grid--three" data-cards></div>
    <p class="mk-empty" data-empty hidden>{{t.empty}}</p>
  </div>
</section>
<div class="mk-cmpbar" data-cmpbar hidden>
  <div class="mk-wrap mk-cmpbar__in"><span data-cmp-count></span><button class="mk-btn mk-btn--primary" type="button" data-cmp-open>{{t.compare}}</button><button class="mk-btn" type="button" data-cmp-clear>{{t.compare_clear}}</button></div>
</div>
<dialog class="mk-sheet" data-cmp-sheet aria-label="{{t.compare}}">
  <div class="mk-sheet__head"><h2 class="mk-h3">{{t.compare}}</h2><button class="mk-x" type="button" data-close aria-label="{{t.close}}"></button></div>
  <div class="mk-cmp" data-cmp></div>
</dialog>
