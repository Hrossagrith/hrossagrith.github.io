<template id="tpl-card">
  <li class="mk-slot">
    <a class="mk-card" data-href>
      <figure class="mk-media" data-media><img alt="" loading="lazy" hidden><span class="mk-media__ph" data-ph></span></figure>
      <div class="mk-card__body">
        <p class="mk-eyebrow" data-f="eyebrow"></p>
        <h3 class="mk-card__name" data-f="name"></h3>
        <p class="mk-card__line" data-f="line"></p>
        <p class="mk-card__meta" data-f="meta"></p>
        <p class="mk-card__price" data-f="price"></p>
      </div>
    </a>
  </li>
</template>

<template id="tpl-row">
  <li class="mk-row">
    <a class="mk-row__media" data-href tabindex="-1" aria-hidden="true">
      <figure class="mk-media" data-media><img alt="" loading="lazy" hidden><span class="mk-media__ph" data-ph></span></figure>
    </a>
    <div class="mk-row__main">
      <h3 class="mk-row__title"><a data-href data-f="title"></a></h3>
      <p class="mk-row__facts" data-f="facts"></p>
      <p class="mk-row__scene" data-f="scene"></p>
      <ul class="mk-row__match" data-match></ul>
      <p class="mk-row__meta" data-f="meta"></p>
    </div>
    <div class="mk-row__side">
      <p class="mk-row__price" data-f="price"></p>
      <p class="mk-row__note" data-f="note"></p>
      <div class="mk-row__actions" data-actions></div>
    </div>
  </li>
</template>

<template id="tpl-top">
  <article class="mk-topcard">
    <a class="mk-topcard__media" data-href tabindex="-1" aria-hidden="true">
      <figure class="mk-media" data-media><img alt="" loading="lazy" hidden><span class="mk-media__ph" data-ph></span></figure>
    </a>
    <div class="mk-topcard__body">
      <p class="mk-eyebrow mk-eyebrow--accent" data-f="badge"></p>
      <h2 class="mk-topcard__title"><a data-href data-f="title"></a></h2>
      <p class="mk-topcard__scene" data-f="scene"></p>
      <p class="mk-row__facts" data-f="facts"></p>
      <ul class="mk-row__match" data-match></ul>
      <p class="mk-topcard__price"><strong data-f="price"></strong> <span class="mk-muted" data-f="note"></span></p>
      <p class="mk-row__meta" data-f="meta"></p>
      <a class="mk-btn mk-btn--sm" data-viewing-link>{{t.book_viewing}}</a>
    </div>
  </article>
</template>

<template id="tpl-matchchip">
  <li></li>
</template>

<template id="tpl-action">
  <button type="button" class="mk-textbtn"></button>
</template>

<template id="tpl-refine-chip">
  <li><a class="mk-chip mk-chip--link" data-href><span data-f="name"></span> <span class="mk-chip__count" data-f="count"></span></a></li>
</template>

<template id="tpl-query">
  <li><a class="mk-query" data-href>
    <span class="mk-query__text" data-f="text"></span>
    <span class="mk-query__meta" data-f="meta"></span>
  </a></li>
</template>

<template id="tpl-suggest">
  <li><a class="mk-suggest__item" data-href>
    <span class="mk-suggest__kind" data-f="kind"></span>
    <span class="mk-suggest__text" data-f="text"></span>
    <span class="mk-suggest__count" data-f="count"></span>
  </a></li>
</template>

<template id="tpl-tile">
  <li class="mk-tiles__item">
    <a class="mk-tile" data-href>
      <span class="mk-tile__img" data-ph></span>
      <span class="mk-tile__name" data-f="name"></span>
      <span class="mk-tile__count" data-f="count"></span>
    </a>
  </li>
</template>

<template id="tpl-feature">
  <li class="mk-slot mk-slot--maker">
    <a class="mk-feature" data-href>
      <span class="mk-eyebrow" data-f="eyebrow"></span>
      <span class="mk-feature__title" data-f="name"></span>
      <span class="mk-feature__line" data-f="line"></span>
      <span class="mk-feature__mark" data-f="mark"></span>
    </a>
  </li>
</template>

<template id="tpl-step">
  <li class="mk-step">
    <span class="mk-step__num" data-f="num"></span>
    <span class="mk-step__label" data-f="label"></span>
    <span class="mk-step__count" data-f="count"></span>
    <span class="mk-step__hint" data-f="hint"></span>
  </li>
</template>

<template id="tpl-steps">
  <div class="mk-path">
    <div class="mk-path__bar"><span class="mk-path__fill" data-fill></span></div>
    <ol class="mk-path__steps" data-body></ol>
    <p class="mk-path__next"><a class="mk-link" data-href data-f="next"></a></p>
  </div>
</template>

<template id="tpl-stamp">
  <li class="mk-stamp"></li>
</template>

<template id="tpl-fgroup">
  <details class="mk-fgroup" open>
    <summary data-f="name"></summary>
    <div class="mk-fgroup__body" data-body></div>
  </details>
</template>

<template id="tpl-fcheck">
  <label class="mk-fcheck"><input type="checkbox"><span data-f="name"></span><span class="mk-fcheck__count" data-f="count"></span></label>
</template>

<template id="tpl-frange">
  <div class="mk-frange">
    <label><span>{{t.range_from}}</span><input type="number" inputmode="numeric" min="0" data-min></label>
    <label><span>{{t.range_to}}</span><input type="number" inputmode="numeric" min="0" data-max></label>
  </div>
</template>

<template id="tpl-chip">
  <li><button type="button" class="mk-chip"><span data-f="name"></span><span class="mk-chip__x" aria-hidden="true">×</span></button></li>
</template>

<template id="tpl-pagelink">
  <a class="mk-pager__link"></a>
</template>

<template id="tpl-para">
  <p></p>
</template>

<template id="tpl-bar">
  <li class="mk-bar">
    <span class="mk-bar__label" data-f="label"></span>
    <span class="mk-bar__track"><span class="mk-bar__fill" data-fill></span></span>
    <span class="mk-bar__word" data-f="word"></span>
  </li>
</template>

<template id="tpl-li">
  <li></li>
</template>

<template id="tpl-link">
  <li><a></a></li>
</template>

<template id="tpl-fact">
  <div><dt data-f="k"></dt><dd data-f="v"></dd></div>
</template>

<template id="tpl-spec">
  <tr><th scope="row" data-f="k"></th><td data-f="v"></td><td class="mk-muted" data-f="rule"></td></tr>
</template>

<template id="tpl-compare-col">
  <div class="mk-compare__col">
    <figure class="mk-media" data-media><img alt="" loading="lazy" hidden><span class="mk-media__ph" data-ph></span></figure>
    <p class="mk-eyebrow" data-f="badge"></p>
    <h3 data-f="name"></h3>
    <p class="mk-compare__price" data-f="price"></p>
    <dl class="mk-compare__rows" data-rows></dl>
    <a class="mk-link" data-href></a>
  </div>
</template>

<template id="tpl-choice">
  <label class="mk-opt">
    <input type="radio">
    <span class="mk-opt__name" data-f="name"></span>
    <span class="mk-opt__line" data-f="line"></span>
    <span class="mk-opt__price" data-f="price"></span>
  </label>
</template>

<template id="tpl-daychip">
  <label class="mk-daychip"><input type="radio"><span data-f="top"></span><strong data-f="main"></strong></label>
</template>

<template id="tpl-option-group">
  <fieldset class="mk-choice">
    <legend data-f="name"></legend>
    <div class="mk-choice__list" data-body></div>
  </fieldset>
</template>

<template id="tpl-swatch">
  <label class="mk-swatch"><input type="radio"><span class="mk-swatch__dot" data-dot></span><span class="mk-swatch__name" data-f="name"></span></label>
</template>

<template id="tpl-mode">
  <button type="button" class="mk-seg__btn" role="tab" aria-selected="false"></button>
</template>

<template id="tpl-provenance">
  <div>
    <p class="mk-eyebrow" data-f="eyebrow"></p>
    <h3 data-f="name"></h3>
    <p data-f="line"></p>
    <dl class="mk-facts" data-facts></dl>
    <a class="mk-link" data-href>{{t.maker_all}}</a>
  </div>
</template>

<template id="tpl-seller-group">
  <section class="mk-sgroup">
    <h2 class="mk-h2"><span data-f="name"></span> <span class="mk-muted" data-f="count"></span></h2>
    <ul class="mk-sgrid" data-body></ul>
    <div class="mk-more"><button type="button" class="mk-btn mk-btn--ghost" data-more hidden>{{t.show_more}}</button></div>
  </section>
</template>

<template id="tpl-seller-tile">
  <li><a class="mk-stile" data-href>
    <span class="mk-stile__name" data-f="name"></span>
    <span class="mk-stile__line" data-f="line"></span>
    <span class="mk-stile__meta" data-f="meta"></span>
  </a></li>
</template>

<template id="tpl-bag-line">
  <li class="mk-bagline">
    <figure class="mk-media" data-media><img alt="" loading="lazy" hidden><span class="mk-media__ph" data-ph></span></figure>
    <div class="mk-bagline__info">
      <h2><a data-href data-f="name"></a></h2>
      <p class="mk-small" data-f="meta"></p>
      <p class="mk-small" data-f="extra"></p>
    </div>
    <p class="mk-bagline__price" data-f="price"></p>
    <button type="button" class="mk-textbtn" data-remove>{{t.remove}}</button>
  </li>
</template>

<template id="tpl-kv">
  <div><dt data-f="k"></dt><dd data-f="v"></dd></div>
</template>

<template id="tpl-option">
  <option></option>
</template>
