<section class="mk-wrap mk-sellerhead" data-seller hidden>
  <p class="mk-eyebrow" data-f="kind"></p>
  <h1 class="mk-h1"><span data-f="name"></span> <span class="mk-muted" data-f="line"></span></h1>
  <dl class="mk-facts mk-facts--row" data-seller-facts></dl>
  <p class="mk-seller-mini__offer" data-seller-offer hidden><span class="mk-muted">{{t.at_viewing}}</span> <span data-f="offer"></span></p>
</section>
<div class="mk-wrap" data-seller-body hidden>
  <ol class="mk-rows" data-rows></ol>
  <ul class="mk-grid" data-grid></ul>
  <div class="mk-more"><button type="button" class="mk-btn mk-btn--ghost" data-more hidden>{{t.show_more}}</button></div>
</div>
<section class="mk-wrap mk-notfound" data-notfound hidden>
  <h1 class="mk-h1"><span>{{t.notfound_title}}</span> <span class="mk-muted">{{t.notfound_seller}}</span></h1>
  <p><a class="mk-link" href="{{mroot}}sellers/">{{t.nav_sellers}}</a></p>
</section>
