<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" preserveAspectRatio="xMidYMid slice"
     role="img" aria-label="A road running through a stone gate between low hills">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--art-sky-top, #dfe7ee)"/>
      <stop offset="1" stop-color="var(--art-sky-bottom, #eef1e9)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#sky)"/>

  <!-- Far hills -->
  <path d="M 0 214 C 120 190, 210 200, 300 210 C 400 221, 470 196, 560 190
           C 660 183, 740 205, 840 202 C 940 199, 1050 178, 1200 192 L 1200 340 L 0 340 Z"
        fill="var(--art-hill-far, #cfdcd3)"/>

  <!-- Middle hills -->
  <path d="M 0 250 C 130 232, 240 246, 350 254 C 460 262, 540 244, 660 242
           C 780 240, 900 258, 1010 252 C 1100 247, 1150 240, 1200 236 L 1200 340 L 0 340 Z"
        fill="var(--art-hill-mid, #b9cdbc)"/>

  <!-- Near ground -->
  <path d="M 0 288 C 160 278, 320 288, 470 292 C 620 296, 760 286, 900 288
           C 1020 290, 1120 294, 1200 292 L 1200 340 L 0 340 Z"
        fill="var(--art-ground, #a8c0ad)"/>

  <!-- The road, narrowing toward the gate -->
  <path d="M 520 214 L 680 214 L 900 340 L 300 340 Z" fill="var(--art-road, #e6e2d4)"/>
  <path d="M 598 216 L 602 216 L 612 340 L 588 340 Z" fill="var(--art-road-line, #ddd6c4)"/>

  <!-- Stone gate: the border at which pursuit stops -->
  <g fill="var(--art-stone, #7d8b84)">
    <rect x="452" y="96" width="46" height="152" rx="4"/>
    <rect x="702" y="96" width="46" height="152" rx="4"/>
    <path d="M 452 96 L 748 96 L 748 132 L 452 132 Z"/>
    <path d="M 498 132 C 520 132, 540 148, 548 172 L 560 172 C 552 140, 528 120, 498 120 Z"/>
    <path d="M 702 132 C 680 132, 660 148, 652 172 L 640 172 C 648 140, 672 120, 702 120 Z"/>
  </g>
  <g fill="var(--art-stone-dark, #63706a)">
    <rect x="446" y="86" width="58" height="14" rx="3"/>
    <rect x="696" y="86" width="58" height="14" rx="3"/>
    <rect x="440" y="72" width="320" height="16" rx="3"/>
  </g>

  <!-- Hoofprints along the road -->
  <g fill="var(--art-hoof, #c8bfa6)">
    <ellipse cx="566" cy="262" rx="4" ry="5"/>
    <ellipse cx="578" cy="264" rx="4" ry="5"/>
    <ellipse cx="546" cy="292" rx="5" ry="6"/>
    <ellipse cx="560" cy="295" rx="5" ry="6"/>
    <ellipse cx="520" cy="324" rx="6" ry="7.5"/>
    <ellipse cx="537" cy="328" rx="6" ry="7.5"/>
  </g>
</svg>
